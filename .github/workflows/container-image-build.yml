name: Build and push container image

on:
  workflow_call:
    inputs:
      custom_tag:
        description: optional custom tag for the image
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch,enable=${{ !startsWith(github.ref_name, 'dependabot/') }}
          type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
          type=raw,value=nightly,enable=${{ github.ref_name == 'main' }}
          type=raw,value=dependabot,enable=${{ github.event_name == 'push' && startsWith(github.ref_name, 'dependabot/') || github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/') }}
          ${{ inputs.custom_tag }}
          type=ref,event=tag
          type=ref,event=pr

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Build and push
      id: build-push
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Print image URL
      run: echo "Image pushed to ${{ steps.build-push.outputs.imageid }}"
