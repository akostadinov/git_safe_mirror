name: Tests

on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install test dependencies
      run: pip install cryptography

    - name: Run tests
      run: python -m pytest tests/ -v
